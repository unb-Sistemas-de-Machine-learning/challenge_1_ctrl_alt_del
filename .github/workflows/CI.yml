name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

  pull_request:
    branches:
      - main

jobs:
  build-backend:
    name: Backend - Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por libtesseract-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend tests
        run: |
          pytest tests/backend

      - name: Validate Python
        run: |
          python -m compileall backend/app

      - name: Build Backend Docker image
        run: |
          docker build -t ta-certo-backend ./backend

  build-frontend:
    name: Frontend - Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ta_certo_brasil/package-lock.json

      - name: Install dependencies
        working-directory: ta_certo_brasil
        run: npm ci

      - name: Run Frontend tests
        run: |
          node --test tests/frontend/api.test.ts

      - name: Build Next.js application
        working-directory: ta_certo_brasil
        run: npm run build

      - name: Build Frontend Docker image
        run: |
          docker build -t ta-certo-frontend ./ta_certo_brasil