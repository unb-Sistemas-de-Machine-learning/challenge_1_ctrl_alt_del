services:

  backend:
    build:
      context: ./backend
    container_name: ta-certo-backend
    ports:
      - "8000:8000"
    environment:
      FRONTEND_URL: ${FRONTEND_URL}
      USUARIO: ${USUARIO}
      PASSWORD: ${PASSWORD}
      OLLAMA_MODEL: ta-certo-brasil

  frontend:
    build:
      context: ./ta_certo_brasil
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: ta-certo-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  